[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-format-convert"
version = "0.1.0"
description = "A small CLI that wraps ffmpeg to batch-convert media in a folder (mov->mp4, oga->mp3, ogg->wav, ...)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The media-format-convert authors" }]
keywords = ["ffmpeg", "media", "convert", "video", "audio", "batch", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]

# No runtime pip dependencies: ffmpeg is a system binary, invoked via subprocess.
dependencies = []

[project.urls]
Homepage = "https://github.com/RAmuSelo/media-format-convert"
Source = "https://github.com/RAmuSelo/media-format-convert"
Issues = "https://github.com/RAmuSelo/media-format-convert/issues"

[project.scripts]
media-format-convert = "media_format_convert.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
